[project]
name = "scribe"
version = "0.1.0"
description = "Local, private meeting transcription with speaker diarization, naming and voice profiles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aalt Westhuis" }]
keywords = ["transcription", "diarization", "speaker-recognition", "pyannote", "parakeet", "mlx", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/aaltw/scribe"
Issues = "https://github.com/aaltw/scribe/issues"

[project.optional-dependencies]
asr = [
    "huggingface-hub; sys_platform == 'darwin'",
    "parakeet-mlx; sys_platform == 'darwin'",
    "pyannote.audio; sys_platform == 'darwin'",
    "torch; sys_platform == 'darwin'",
]

[project.scripts]
scribe = "scribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests", "skills/transcribe/*.py"]

# The asr extra (macOS only) is absent in CI. Its imports are listed exactly, no wildcards:
# scribe.diarize and scribe.transcribe import huggingface_hub, parakeet_mlx, pyannote.audio and
# torch, and their typing pulls in numpy, parakeet_mlx.audio, mlx and mlx.core. mypy keys these options on the imported module, not the importer, so
# this is as narrow as it gets. follow_imports = "skip" makes them Any both in CI and in a local
# sync with the extra, so the two runs type-check the same code.
[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "mlx",
    "mlx.core",
    "numpy",
    "parakeet_mlx",
    "parakeet_mlx.audio",
    "pyannote.audio",
    "torch",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
