name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: No personal data tracked (ADR 0001)
        run: |
          bad=$(git ls-files | grep -iE '^(meetings|\.scribe)/|\.(wav|mp3|m4a|flac|ogg|mp4|mov|mkv|npy|npz)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked paths hold personal data (Recordings, Transcripts or Voice profiles); remove them from git:"
            echo "$bad"
            exit 1
          fi
      # Static ffmpeg 7.0.2 (johnvansickle.com), cached so a warm run does no download and no apt-get.
      # The sha256 is pinned; the source publishes only an md5 (7fa72b65...), which matched at authoring time.
      # If upstream ships a new build, the step warns and falls back to apt-get instead of failing.
      - name: Restore static ffmpeg cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-7.0.2-amd64
      - name: Install ffmpeg if the runner lacks it
        env:
          FFMPEG_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
        run: |
          if ! command -v ffmpeg ffprobe > /dev/null; then
            if [ ! -x ~/ffmpeg-static/ffmpeg ] || [ ! -x ~/ffmpeg-static/ffprobe ]; then
              # && chain, not set -e: set -e is ignored inside an `if !` condition.
              if ! { curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                && echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c - \
                && mkdir -p ~/ffmpeg-static \
                && tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C ~/ffmpeg-static --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe'; }; then
                echo "::warning::Static ffmpeg download, checksum or extract failed (upstream probably shipped a new build). Bump FFMPEG_SHA256 and the cache key ffmpeg-static-7.0.2-amd64 in ci.yml. Falling back to apt-get."
                # Never leave a partial install where actions/cache would save it.
                rm -rf ~/ffmpeg-static "$RUNNER_TEMP/ffmpeg.tar.xz"
                sudo apt-get update && sudo apt-get install -y ffmpeg
              fi
            fi
            if [ -x ~/ffmpeg-static/ffmpeg ] && [ -x ~/ffmpeg-static/ffprobe ]; then
              echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
              export PATH="$HOME/ffmpeg-static:$PATH"
            fi
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Bare mypy reads `files` from pyproject.toml, which includes the skill helpers.
      - run: uv run mypy
      - run: uv run pytest

  # Secrets scan on every push and PR, docs included.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned betterleaks CLI (MIT, from the gitleaks author), not gitleaks/gitleaks-action@v2.
      # Bump version and all four sha256s together, from the release's checksums.txt.
      - name: betterleaks (pinned CLI)
        env:
          BETTERLEAKS_VERSION: 1.9.0
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          # runner.temp is unique per job and emptied at job end, so nothing lands in a shared tmp.
          TMPDIR: ${{ runner.temp }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   plat=linux_x64    sum=f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7 ;;
            Linux-ARM64) plat=linux_arm64  sum=1d39116e0a58dc94574715e2aa12a2dbd5062f193eee3fec011fef6ba06bd13b ;;
            macOS-X64)   plat=darwin_x64   sum=68dfd83458d9e7f90663daa7a81c7f944083b170dae82e4f5f8d0581ed519ef1 ;;
            macOS-ARM64) plat=darwin_arm64 sum=83dd7eaab13d44a1e8e347a17064cdef153a1478db473276d41b38d55613d3f2 ;;
            *) echo "::error::no pinned betterleaks for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/betterleaks" tgz="betterleaks_${BETTERLEAKS_VERSION}_${plat}.tar.gz"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$tgz" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$tgz"
          echo "$sum  $dir/$tgz" | shasum -a 256 -c -
          tar -xzf "$dir/$tgz" -C "$dir" betterleaks
          # Range: a PR scans base..head. A push scans before..sha. A new branch (before is all
          # zeros) or a force push (before is no longer in the checkout) scans all history
          # reachable from the pushed sha: a superset, and the repo is small.
          if [ "$EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2> /dev/null; then
            range="$PUSH_SHA"
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
          fi
          echo "betterleaks scans: $range"
          # A finding exits 1 (default --exit-code), which fails the job.
          "$dir/betterleaks" git --redact --verbose --log-opts="$range" .
